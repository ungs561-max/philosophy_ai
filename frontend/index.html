<div class="library">
  <header class="masthead">
    <div class="brand"><span class="seal" aria-hidden="true">✦</span>철학자의 서재</div>
    <nav id="philosophers" aria-label="철학자 선택"></nav>
  </header>
  <main class="stage">
    <img class="backdrop" id="backdrop" alt="">
    <div class="scenery">
      <div id="portraits" class="portraits" data-state="idle" aria-hidden="true"></div>
      <div class="location" aria-hidden="true"><span id="era"></span><strong id="place"></strong></div>
      <button id="scene-toggle" class="mobile-only" type="button" aria-controls="portraits" aria-expanded="true"><span>일러스트 접기</span></button>
    </div>
    <section class="panel" aria-labelledby="name">
      <div class="panel-head">
        <div class="identity">
          <div id="latin" class="eyebrow"></div>
          <h1 id="name">에픽테토스</h1>
          <p id="intro"></p>
        </div>
        <button id="reset" class="quiet reset" type="button">새 대화</button>
        <select id="mobile-mode" class="mobile-only" aria-label="대화 모드">
          <option value="counsel">철학 상담</option>
          <option value="study">철학 공부</option>
        </select>
        <details id="mobile-actions" class="mobile-only">
          <summary aria-label="대화 옵션">⋯</summary>
          <div class="extra-actions">
            <button id="mobile-reset" type="button" class="quiet">새 대화</button>
            <button id="show-profile" type="button" class="quiet">철학자 소개</button>
          </div>
        </details>
      </div>
      <dialog id="profile-details" aria-labelledby="profile-name">
        <h2 id="profile-name"></h2>
        <p id="profile-school"></p>
        <p id="profile-intro"></p>
        <form method="dialog"><button class="quiet">닫기</button></form>
      </dialog>
      <div id="modes" class="modes" role="group" aria-label="대화 모드">
        <button type="button" data-mode="counsel" aria-pressed="true">철학 상담</button>
        <button type="button" data-mode="study" aria-pressed="false">철학 공부</button>
      </div>
      <div class="panel-scroll" id="panel-scroll" tabindex="0" aria-label="대화 및 성찰 카드">
        <aside class="daily" id="daily" hidden>
          <button id="daily-toggle" class="mobile-only quiet" type="button" aria-controls="daily-content" aria-expanded="false"></button>
          <div id="daily-content">
            <div class="eyebrow" id="daily-title"></div>
            <p id="daily-main"></p>
            <p id="daily-source"></p>
            <p id="daily-detail"></p>
            <button id="daily-action" class="quiet" type="button"></button>
          </div>
        </aside>
        <div id="messages" class="messages" aria-label="대화 기록"></div>
      </div>
      <div class="composer">
        <div class="status-line">
          <span id="status" role="status"></span>
          <button id="skip" type="button" class="quiet" hidden>답변 바로 보기</button>
        </div>
        <form id="form">
          <textarea id="draft" rows="2" maxlength="4000" aria-label="메시지" placeholder="요즘 어떤 고민이 있나요?" disabled></textarea>
          <button id="send" type="submit" aria-label="전송" disabled><span class="send-label">전송</span><span class="mobile-only send-arrow" aria-hidden="true">↑</span></button>
        </form>
      </div>
    </section>
  </main>
</div>
